{% extends "base.html" %}
{% block title %}Projections — Finance{% endblock %}

{% block content %}
<div class="space-y-8 fade-in">

  <!-- ── Header ── -->
  <div class="flex flex-col sm:flex-row sm:items-end gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-100">Projections</h1>
      <p class="text-sm text-slate-400 mt-1">Projected annual spend &amp; income based on recent history</p>
    </div>

    <!-- Lookback selector -->
    <div class="sm:ml-auto flex items-end gap-3">
      <div class="flex flex-col gap-1">
        <label class="text-xs text-slate-500 uppercase tracking-wider">Base on last</label>
        <select id="lookback-select"
                class="bg-surface border border-slate-600 rounded-lg px-3 py-2 text-sm
                       text-slate-100 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500">
          <option value="3">3 months</option>
          <option value="6">6 months</option>
          <option value="12" selected>12 months</option>
          <option value="24">24 months</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ── Summary cards ── -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4" id="proj-cards">
    <div class="bg-surface rounded-xl p-5 border border-slate-700 animate-pulse">
      <div class="h-3 bg-slate-700 rounded w-2/3 mb-3"></div>
      <div class="h-8 bg-slate-700 rounded w-1/2"></div>
    </div>
    <div class="bg-surface rounded-xl p-5 border border-slate-700 animate-pulse">
      <div class="h-3 bg-slate-700 rounded w-2/3 mb-3"></div>
      <div class="h-8 bg-slate-700 rounded w-1/2"></div>
    </div>
    <div class="bg-surface rounded-xl p-5 border border-slate-700 animate-pulse">
      <div class="h-3 bg-slate-700 rounded w-2/3 mb-3"></div>
      <div class="h-8 bg-slate-700 rounded w-1/2"></div>
    </div>
  </div>

  <!-- ── Table + Chart side by side ── -->
  <div class="grid grid-cols-1 xl:grid-cols-5 gap-6">

    <!-- Projection table (3 cols) -->
    <div class="xl:col-span-3 bg-surface rounded-xl border border-slate-700">
      <div class="px-6 py-4 border-b border-slate-700 flex items-center gap-3">
        <h2 class="font-semibold text-slate-100">By Category</h2>
        <span id="proj-basis-label" class="text-xs text-slate-500"></span>
      </div>
      <div class="table-scroll">
        <div id="proj-table-wrap" class="p-4">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

    <!-- Projected annual bar chart (2 cols) -->
    <div class="xl:col-span-2 bg-surface rounded-xl border border-slate-700 flex flex-col">
      <div class="px-6 py-4 border-b border-slate-700">
        <h2 class="font-semibold text-slate-100">Projected Annual</h2>
      </div>
      <div class="p-6 flex-1 flex items-center">
        <canvas id="chart-proj"></canvas>
      </div>
    </div>

  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
let projChart = null;

function load() {
  const months = document.getElementById('lookback-select').value;
  document.getElementById('proj-table-wrap').innerHTML = '<div class="spinner"></div>';
  document.getElementById('proj-cards').innerHTML = `
    ${[1,2,3].map(() => `
      <div class="bg-surface rounded-xl p-5 border border-slate-700 animate-pulse">
        <div class="h-3 bg-slate-700 rounded w-2/3 mb-3"></div>
        <div class="h-8 bg-slate-700 rounded w-1/2"></div>
      </div>
    `).join('')}`;

  fetch(`/api/projections?months=${months}`)
    .then(r => r.json())
    .then(data => {
      renderCards(data);
      renderTable(data);
      renderChart(data);
    })
    .catch(() => {
      document.getElementById('proj-table-wrap').innerHTML =
        '<p class="text-slate-500 text-sm p-2">Failed to load projections.</p>';
    });
}

/* ─── Cards ─────────────────────────────────────────────────────── */
function renderCards(data) {
  document.getElementById('proj-basis-label').textContent =
    `Based on ${data.lookback_months} complete month${data.lookback_months === 1 ? '' : 's'}`;

  const cards = [
    {
      label: 'Projected Annual Spend',
      value: fmtAmt(data.total_projected_spend),
      sub: fmtAmt(data.total_projected_spend / 12) + ' / mo avg',
      color: 'text-red-400',
    },
    {
      label: 'Projected Annual Income',
      value: fmtAmt(data.total_projected_income),
      sub: fmtAmt(data.total_projected_income / 12) + ' / mo avg',
      color: 'text-emerald-400',
    },
    {
      label: 'Projected Net',
      value: fmtAmt(data.projected_net),
      sub: data.projected_net >= 0 ? 'projected savings' : 'projected deficit',
      color: data.projected_net >= 0 ? 'text-sky-400' : 'text-red-400',
    },
  ];

  document.getElementById('proj-cards').innerHTML = cards.map(c => `
    <div class="bg-surface rounded-xl p-5 border border-slate-700">
      <p class="text-xs text-slate-500 uppercase tracking-wider mb-2">${c.label}</p>
      <p class="text-2xl font-bold ${c.color}">${c.value}</p>
      <p class="text-xs text-slate-500 mt-1">${c.sub}</p>
    </div>
  `).join('');
}

/* ─── Table ─────────────────────────────────────────────────────── */
function renderTable(data) {
  const wrap = document.getElementById('proj-table-wrap');
  if (!data.rows || data.rows.length === 0) {
    wrap.innerHTML = '<p class="text-slate-500 text-sm p-2">No data yet.</p>';
    return;
  }

  const thead = `<thead><tr>
    <th class="bg-surface text-left text-xs text-slate-400 px-4 py-2.5 font-medium whitespace-nowrap border-b border-slate-700 min-w-[180px]">Category</th>
    <th class="bg-surface text-right text-xs text-slate-400 px-4 py-2.5 font-medium whitespace-nowrap border-b border-slate-700">Avg / Month</th>
    <th class="bg-surface text-right text-xs text-sky-400 px-4 py-2.5 font-medium whitespace-nowrap border-b border-slate-700">Projected Annual</th>
  </tr></thead>`;

  const rows = data.rows.map((r, i) => {
    const bg = i % 2 === 0 ? 'bg-base' : 'bg-surface';
    return `<tr>
      <td class="${bg} px-4 py-2 text-sm text-slate-200">${r.category}</td>
      <td class="${bg} text-right px-4 py-2 text-xs">${amtSpan(r.avg_monthly)}</td>
      <td class="${bg} text-right px-4 py-2 text-xs font-semibold">${amtSpan(r.projected_annual)}</td>
    </tr>`;
  }).join('');

  // Totals
  const tfoot = `<tfoot>
    <tr>
      <td class="bg-slate-950 px-4 py-2.5 text-sm font-bold text-slate-200 border-t border-slate-600">Total Spend</td>
      <td class="bg-slate-950 text-right px-4 py-2.5 text-xs font-bold border-t border-slate-600">
        ${amtSpan(data.total_projected_spend / 12)}
      </td>
      <td class="bg-slate-950 text-right px-4 py-2.5 text-xs font-bold border-t border-slate-600">
        <span class="text-red-400">${fmtAmt(data.total_projected_spend)}</span>
      </td>
    </tr>
    <tr>
      <td class="bg-slate-950 px-4 py-2.5 text-sm font-bold text-slate-200">Total Income</td>
      <td class="bg-slate-950 text-right px-4 py-2.5 text-xs font-bold">
        ${amtSpan(data.total_projected_income / 12)}
      </td>
      <td class="bg-slate-950 text-right px-4 py-2.5 text-xs font-bold">
        <span class="text-emerald-400">${fmtAmt(data.total_projected_income)}</span>
      </td>
    </tr>
    <tr>
      <td class="bg-slate-950 px-4 py-2.5 text-sm font-bold text-slate-200 border-t border-slate-600">Net</td>
      <td class="bg-slate-950 text-right px-4 py-2.5 text-xs font-bold border-t border-slate-600">
        ${amtSpan(data.projected_net / 12)}
      </td>
      <td class="bg-slate-950 text-right px-4 py-2.5 text-xs font-bold border-t border-slate-600">
        ${amtSpan(data.projected_net)}
      </td>
    </tr>
  </tfoot>`;

  wrap.innerHTML = `
    <table class="w-full text-xs border-collapse">
      ${thead}
      <tbody>${rows}</tbody>
      ${tfoot}
    </table>`;
}

/* ─── Bar chart ─────────────────────────────────────────────────── */
function renderChart(data) {
  const canvas = document.getElementById('chart-proj');
  const visible = data.rows.filter(r => Math.abs(r.projected_annual) > 0.01)
    .sort((a, b) => Math.abs(b.projected_annual) - Math.abs(a.projected_annual))
    .slice(0, 15);

  if (projChart) projChart.destroy();
  projChart = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: visible.map(r => r.category),
      datasets: [{
        label: 'Projected Annual',
        data: visible.map(r => r.projected_annual),
        backgroundColor: visible.map(r => r.projected_annual >= 0
          ? 'rgba(74,222,128,0.75)' : 'rgba(248,113,113,0.75)'),
        borderRadius: 4,
        borderSkipped: false,
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => fmtAmt(ctx.raw) } }
      },
      scales: {
        x: {
          grid: { color: '#334155' },
          ticks: { callback: v => fmtK(v), font: { size: 10 } }
        },
        y: {
          grid: { color: '#1e293b' },
          ticks: { font: { size: 10 } }
        }
      }
    }
  });
}

document.getElementById('lookback-select').addEventListener('change', load);
load();
</script>
{% endblock %}
